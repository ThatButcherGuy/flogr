{% extends "layout.html" %}

{% block title %}
Register
{% endblock %}

{% block main %}
<div class="auth-card">
    <div class="card">
        <div class="card-header text-center">
            <h3 class="mb-0">Create an account</h3>
        </div>
        <div class="card-body">
            <form id="register" action="/register" method="post">
                <div class="mb-3">
                    <label for="reg-username" class="form-label">Username</label>
                    <input id="reg-username" autocomplete="off" autofocus class="form-control lowercase" name="username"
                        placeholder="Username" type="text" oninput="forceLowerCase(this)" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input autocomplete="off" class="form-control" id="email" name="email" placeholder="Email" type="email" required>
                </div>
                <div class="mb-3">
                    <label for="reg-password" class="form-label">Password</label>
                    <input class="form-control" id="reg-password" name="password" placeholder="Password" type="password" required>
                </div>
                <div class="mb-3">
                    <label for="reg-confirm" class="form-label">Re-type Password</label>
                    <input class="form-control" id="reg-confirm" name="confirmation" placeholder="Re-Type Password" type="password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Register</button>
            </form>
            <hr class="my-4">
            <p class="text-center text-muted mb-2">Already have an account?</p>
            <a class="btn btn-outline-primary w-100" href="/login">Log In</a>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
{{ super() }}
<script>
    function forceLowerCase(input) {
        input.value = input.value.toLowerCase();
    }

    document.getElementById('register').addEventListener('submit', function(event) {
        const emailInput = document.getElementById('email');
        const email = emailInput.value;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailRegex.test(email)) {
            alert('Please enter a valid email address.');
            event.preventDefault();
        }
    });
</script>
{% endblock %}
