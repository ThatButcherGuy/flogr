{% extends "layout.html" %}

{% block title %}
Home
{% endblock %}

{% block main %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>Enter a new record</h2>
            <br>
            <form id="new_record" action="/new_record" method="post">
                <div class="row">
                    <div class="col-md-12">
                        <div class="mb-3">
                            <label for="registration" class="form-label req">Select Vehicle</label>
                            <select id="registration" class="form-control" name="registration" required>
                                <option value="" selected disabled>Registration</option>
                                {% for vehicle in vehicles %}
                                <option value="{{ vehicle.registration }}" data-fuel-type="{{ vehicle.fuel_type }}">{{ vehicle.registration }}: {{ vehicle.make }} {{ vehicle.model }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="fuel_type" class="form-label req">Fuel Type</label>
                            <select id="fuel_type" class="form-control" name="fuel_type" required>
                                <option value="" selected disabled>Fuel Type</option>
                                {% for fuel in fuel_types %}
                                <option value="{{ fuel.code }}">{{ fuel.code }}: {{ fuel.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="date" class="form-label req">Date</label>
                            <input id="date" class="form-control" type="date" name="date" value="{{ today_date }}" required>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="receipt_number" class="form-label">Receipt Number</label>
                            <input id="receipt_number" class="form-control" type="text" name="receipt_number" placeholder="Enter receipt number">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="location_id" class="form-label">Purchased At</label>
                            <div class="input-group">
                                <select id="location_id" class="form-control" name="location_id">
                                    <option value="" selected>Select location…</option>
                                    {% for loc in locations %}
                                    <option value="{{ loc.id }}">{{ loc.retailer }} {{ loc.suburb }}</option>
                                    {% endfor %}
                                </select>
                                <button type="button" class="btn btn-outline-secondary" id="addLocationBtn"
                                    title="Add a new location" data-bs-toggle="modal" data-bs-target="#addLocationModal">+ New</button>
                            </div>
                            <small class="text-muted">Pick an existing location, or add a new one.</small>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="litres" class="form-label req">Litres</label>
                            <input id="litres" class="form-control" type="number" name="litres" min="0" step="0.01" placeholder="Enter litres" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="price_per_litre" class="form-label req">Price per Litre</label>
                            <input id="price_per_litre" class="form-control" type="number" name="price_per_litre" min="0" step="0.001" placeholder="Enter price per litre" required>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="kilometres" class="form-label req">Kilometres</label>
                            <input id="kilometres" class="form-control" type="number" name="kilometres" min="0" step="1" placeholder="Enter kilometre reading" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="comments" class="form-label">Comments</label>
                            <textarea id="comments" class="form-control" name="comments" rows="3" placeholder="Enter comments" maxlength="150"></textarea>
                            <div id="charCount" style="font-size: smaller;"></div>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary" type="submit">Save</button>
                <span class="text-muted ms-2" style="font-size: small;"><span style="color:#dc3545;">*</span> required</span>
            </form>
        </div>
    </div>
</div>

<!-- Inline "Add new location" modal — separate from the log form so entering a
     new location never clears values already typed into the record form. -->
<div class="modal fade" id="addLocationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="addLocationForm">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Location</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="newRetailer" class="form-label">Retailer <span style="color:#dc3545">*</span></label>
                        <input id="newRetailer" class="form-control" type="text" name="retailer" placeholder="e.g. Costco" required>
                    </div>
                    <div class="mb-3">
                        <label for="newSuburb" class="form-label">Suburb <span style="color:#dc3545">*</span></label>
                        <input id="newSuburb" class="form-control" type="text" name="suburb" placeholder="e.g. Majura" required>
                    </div>
                    <div id="addLocationMsg" class="text-danger" style="font-size:small;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Location</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Populate default fuel type for vehicle selected
document.getElementById('registration').addEventListener('change', function() {
    var selectedOption = this.options[this.selectedIndex];
    var fuelType = selectedOption.getAttribute('data-fuel-type');
    var fuelTypeSelect = document.getElementById('fuel_type');
    for (var i = 0; i < fuelTypeSelect.options.length; i++) {
        if (fuelTypeSelect.options[i].value === fuelType) {
            fuelTypeSelect.selectedIndex = i;
            break;
        }
    }
});

// Calculate and display the character count for the comments field
const textField = document.getElementById('comments');
const charCountDisplay = document.getElementById('charCount');

// Define the maximum character limit
const maxLimit = 150;

// Add an event listener to the input field to update character count
textField.addEventListener('input', function() {
    const currentLength = textField.value.length;
    charCountDisplay.textContent = `${currentLength}/${maxLimit}`;

    if (currentLength > maxLimit) {
        charCountDisplay.style.color = 'red';
    } else {
        charCountDisplay.style.color = 'grey';
    }
});

document.getElementById('addLocationForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const msg = document.getElementById('addLocationMsg');
    msg.textContent = '';
    const retailer = document.getElementById('newRetailer').value.trim();
    const suburb = document.getElementById('newSuburb').value.trim();
    if (!retailer || !suburb) { msg.textContent = 'Both retailer and suburb are required.'; return; }

    const formData = new FormData();
    formData.append('retailer', retailer);
    formData.append('suburb', suburb);

    try {
        const resp = await fetch('/locations/add', {
            method: 'POST',
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            body: formData
        });
        const data = await resp.json();
        if (!data.ok) {
            msg.textContent = data.error || 'Could not add location.';
            return;
        }
        // Add the (possibly newly created) location to the dropdown and select it
        const select = document.getElementById('location_id');
        const existingOpt = [...select.options].find(o => o.value === String(data.location_id));
        if (existingOpt) {
            existingOpt.selected = true;
        } else {
            const opt = document.createElement('option');
            opt.value = data.location_id;
            opt.textContent = data.label;
            select.appendChild(opt);
            opt.selected = true;
        }
        // Close the modal and clear its fields
        bootstrap.Modal.getInstance(document.getElementById('addLocationModal')).hide();
        document.getElementById('newRetailer').value = '';
        document.getElementById('newSuburb').value = '';
        // The rest of the log form is untouched — nothing was reset.
    } catch (err) {
        msg.textContent = 'Network error: ' + err.message;
    }
});

</script>
{% endblock %}
