{% extends "layout.html" %}

{% block title %}Edit Log{% endblock %}

{% block main %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>Edit Log Entry</h2>
            <br>
            <form id="edit_record" action="{{ url_for('edit_log', log_id=log['id']) }}" method="post">

                <!-- Vehicle / Registration -->
                <div class="mb-3">
                    <label for="registration" class="form-label">Select Vehicle</label>
                    <select id="registration" class="form-control" name="registration" required>
                        <option value="" disabled>Registration</option>
                        {% for vehicle in vehicles %}
                        <option value="{{ vehicle['registration'] }}" data-fuel-type="{{ vehicle.get('fuel_type', '') }}" {% if
                            vehicle['registration']==log['registration'] %}selected{% endif %}>
                            {{ vehicle['registration'] }}: {{ vehicle.get('make','') }} {{ vehicle.get('model','') }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Fuel Type -->
                <div class="mb-3">
                    <label for="fuel_type" class="form-label">Fuel Type</label>
                    <select id="fuel_type" class="form-control" name="fuel_code" required>
                        <option value="" disabled>Select Fuel Type</option>
                        {% for fuel in fuel_types %}
                        <option value="{{ fuel['code'] }}" {% if fuel['code']==log.get('fuel_code') %}selected{% endif %}>
                            {{ fuel['code'] }}: {{ fuel['name'] }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Date -->
                <div class="mb-3">
                    <label for="date" class="form-label">Date</label>
                    <input id="date" class="form-control" type="date" name="date" value="{{ log['date'] }}" required>
                </div>

                <!-- Receipt Number -->
                <div class="mb-3">
                    <label for="receipt_number" class="form-label">Receipt Number</label>
                    <input id="receipt_number" class="form-control" type="text" name="receipt_number"
                        value="{{ log['receipt_number'] }}" placeholder="Enter receipt number">
                </div>

                <!-- Purchased At -->
                <div class="mb-3">
                    <label for="location_id" class="form-label">Purchased At</label>
                    <div class="input-group">
                        <select id="location_id" class="form-control" name="location_id">
                            <option value="">No location</option>
                            {% for loc in locations %}
                            <option value="{{ loc.id }}" {% if log['location_id'] and log['location_id']|int == loc.id %}selected{% endif %}>
                                {{ loc.retailer }} {{ loc.suburb }}
                            </option>
                            {% endfor %}
                        </select>
                        <button type="button" class="btn btn-outline-secondary" id="addLocationBtn"
                            title="Add a new location" data-bs-toggle="modal" data-bs-target="#addLocationModal">+ New</button>
                    </div>
                    <small class="text-muted">Pick an existing location, or add a new one.</small>
                </div>

                <!-- Litres and Price per Litre -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="litres" class="form-label">Litres</label>
                        <input id="litres" class="form-control" type="number" name="litres" min="0" step="0.01"
                            value="{{ log['litres'] }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="price_per_litre" class="form-label">Price per Litre</label>
                        <input id="price_per_litre" class="form-control" type="number" name="price_per_litre" min="0"
                            step="0.001" value="{{ log['price_per_litre'] }}" required>
                    </div>
                </div>

                <!-- Kilometres -->
                <div class="mb-3">
                    <label for="kilometres" class="form-label">Kilometres</label>
                    <input id="kilometres" class="form-control" type="number" name="kilometres" min="0" step="1"
                        value="{{ log['kilometres'] }}" required>
                </div>

                <!-- Comments -->
                <div class="mb-3">
                    <label for="comments" class="form-label">Comments</label>
                    <textarea id="comments" class="form-control" name="comments" rows="3" maxlength="150"
                        placeholder="Enter comments">{{ log['comments'] }}</textarea>
                    <div id="charCount" style="font-size: smaller;"></div>
                </div>

                <!-- Buttons -->
                <button class="btn btn-success" type="submit">Save</button>
                <button class="btn btn-danger" type="submit" name="delete" value="1"
                    onclick="return confirm('Are you sure you want to delete this record?');">Delete</button>
                <a href="{{ url_for('view_log') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

<!-- Inline "Add new location" modal — does not clear the edit form -->
<div class="modal fade" id="addLocationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="addLocationForm">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Location</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="newRetailer" class="form-label">Retailer <span style="color:#dc3545">*</span></label>
                        <input id="newRetailer" class="form-control" type="text" name="retailer" placeholder="e.g. Costco" required>
                    </div>
                    <div class="mb-3">
                        <label for="newSuburb" class="form-label">Suburb <span style="color:#dc3545">*</span></label>
                        <input id="newSuburb" class="form-control" type="text" name="suburb" placeholder="e.g. Majura" required>
                    </div>
                    <div id="addLocationMsg" class="text-danger" style="font-size:small;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Location</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Auto-set fuel type when registration changes
    document.getElementById('registration').addEventListener('change', function () {
        var selectedOption = this.options[this.selectedIndex];
        var fuelType = selectedOption.getAttribute('data-fuel-type');
        var fuelTypeSelect = document.getElementById('fuel_type');
        for (var i = 0; i < fuelTypeSelect.options.length; i++) {
            if (fuelTypeSelect.options[i].value === fuelType) {
                fuelTypeSelect.selectedIndex = i;
                break;
            }
        }
    });

    // Comments character counter
    const textField = document.getElementById('comments');
    const charCountDisplay = document.getElementById('charCount');
    const maxLimit = 150;
    function updateCharCount() {
        const len = textField.value.length;
        charCountDisplay.textContent = `${len}/${maxLimit}`;
        charCountDisplay.style.color = len > maxLimit ? 'red' : 'grey';
    }
    textField.addEventListener('input', updateCharCount);
    updateCharCount();

    // Inline add-new location (fetch POST, never resets the edit form)
    document.getElementById('addLocationForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const msg = document.getElementById('addLocationMsg');
        msg.textContent = '';
        const retailer = document.getElementById('newRetailer').value.trim();
        const suburb = document.getElementById('newSuburb').value.trim();
        if (!retailer || !suburb) { msg.textContent = 'Both retailer and suburb are required.'; return; }

        const formData = new FormData();
        formData.append('retailer', retailer);
        formData.append('suburb', suburb);

        try {
            const resp = await fetch('/locations/add', {
                method: 'POST',
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
                body: formData
            });
            const data = await resp.json();
            if (!data.ok) {
                msg.textContent = data.error || 'Could not add location.';
                return;
            }
            const select = document.getElementById('location_id');
            const existingOpt = [...select.options].find(o => o.value === String(data.location_id));
            if (existingOpt) {
                existingOpt.selected = true;
            } else {
                const opt = document.createElement('option');
                opt.value = data.location_id;
                opt.textContent = data.label;
                select.appendChild(opt);
                opt.selected = true;
            }
            bootstrap.Modal.getInstance(document.getElementById('addLocationModal')).hide();
            document.getElementById('newRetailer').value = '';
            document.getElementById('newSuburb').value = '';
        } catch (err) {
            msg.textContent = 'Network error: ' + err.message;
        }
    });
</script>
{% endblock %}
